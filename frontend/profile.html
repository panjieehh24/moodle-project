<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile — UGM Learn</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg></div>
      <span class="brand-name">UGM Learn</span>
    </div>
    <nav></nav>
    <div class="sidebar-footer">
      <button class="logout-btn" onclick="logout()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Sign out</button>
    </div>
  </aside>

  <div class="main-wrap">
    <header class="topbar">
      <span class="page-title">My profile</span>
      <div class="topbar-right">
        <button class="bell-btn" onclick="location.href='notifications.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg><span class="bell-badge" id="bell-badge"></span></button>
        <div class="user-chip">
          <div class="user-avatar" id="user-avatar">?</div>
          <div class="user-info"><strong id="user-name"></strong><span id="user-role"></span></div>
        </div>
      </div>
    </header>

    <main class="content" style="max-width:920px">
      <!-- profile header -->
      <div class="card" style="background:var(--navy-900);border-color:var(--navy-700);position:relative;overflow:hidden">
        <div style="position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(115deg,#000,transparent 70%);pointer-events:none"></div>
        <div class="card-body" style="padding:2rem;position:relative">
          <div class="profile-hero">
            <div class="big-avatar" id="big-avatar">?</div>
            <div>
              <h2 id="p-name" style="color:#fff">—</h2>
              <span class="badge" id="p-role" style="background:rgba(169,119,42,.2);color:var(--gold-lt);border-color:rgba(169,119,42,.4)">—</span>
              <div class="meta-row" style="color:rgba(255,255,255,.6)">
                <span id="p-email">—</span>
                <span id="p-since">—</span>
                <span id="p-last">—</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="grid-2" style="margin-top:1.5rem">
        <div class="card">
          <div class="card-header">Edit details</div>
          <div class="card-body">
            <div id="edit-msg" class="alert" style="display:none"></div>
            <div class="form-group"><label>Full name</label><input class="form-control" id="f-name"></div>
            <div class="form-group"><label>Phone</label><input class="form-control" id="f-phone" placeholder="Optional"></div>
            <div class="form-group"><label>Bio</label><textarea class="form-control" id="f-bio" placeholder="A short bio…"></textarea></div>
            <button class="btn btn-primary" onclick="saveDetails()">Save changes</button>
          </div>
        </div>

        <div class="card">
          <div class="card-header">Change password</div>
          <div class="card-body">
            <div id="pw-msg" class="alert" style="display:none"></div>
            <div class="form-group"><label>New password</label><input class="form-control" type="password" id="f-pw" placeholder="At least 6 characters"></div>
            <div class="form-group"><label>Confirm password</label><input class="form-control" type="password" id="f-pw2" placeholder="Repeat new password"></div>
            <button class="btn btn-primary" onclick="changePw()">Update password</button>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
(async () => {
  const user = await initShell();
  if (!user) return;
  if (user.name) document.getElementById("user-avatar").textContent = user.name.charAt(0).toUpperCase();

  const me = await api.auth.me();
  document.getElementById("big-avatar").textContent = (me.name || "?").charAt(0).toUpperCase();
  document.getElementById("p-name").textContent = me.name;
  document.getElementById("p-role").textContent = me.role;
  document.getElementById("p-email").textContent = me.email;
  document.getElementById("p-since").textContent = "Joined " + new Date(me.created_at).toLocaleDateString();
  document.getElementById("p-last").textContent = me.last_login_at
    ? "Last login " + new Date(me.last_login_at).toLocaleDateString()
    : "First session";
  document.getElementById("f-name").value = me.name || "";
  document.getElementById("f-phone").value = me.phone || "";
  document.getElementById("f-bio").value = me.bio || "";
})();

async function saveDetails() {
  const msg = document.getElementById("edit-msg");
  try {
    await api.auth.updateMe({
      name: document.getElementById("f-name").value.trim(),
      phone: document.getElementById("f-phone").value.trim(),
      bio: document.getElementById("f-bio").value.trim(),
    });
    msg.className = "alert alert-success";
    msg.textContent = "Saved. Your name updates everywhere after the next sign-in.";
    msg.style.display = "block";
    document.getElementById("p-name").textContent = document.getElementById("f-name").value.trim();
  } catch (e) {
    msg.className = "alert alert-danger"; msg.textContent = e.message; msg.style.display = "block";
  }
}

async function changePw() {
  const msg = document.getElementById("pw-msg");
  const pw = document.getElementById("f-pw").value, pw2 = document.getElementById("f-pw2").value;
  if (pw.length < 6) { msg.className="alert alert-danger"; msg.textContent="Password must be at least 6 characters"; msg.style.display="block"; return; }
  if (pw !== pw2)   { msg.className="alert alert-danger"; msg.textContent="Passwords do not match"; msg.style.display="block"; return; }
  try {
    await api.auth.updateMe({ password: pw });
    msg.className = "alert alert-success"; msg.textContent = "Password updated."; msg.style.display = "block";
    document.getElementById("f-pw").value = ""; document.getElementById("f-pw2").value = "";
  } catch (e) {
    msg.className = "alert alert-danger"; msg.textContent = e.message; msg.style.display = "block";
  }
}
</script>
</body>
</html>
