<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notifications — UGM Learn</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg></div>
      <span class="brand-name">UGM Learn</span>
    </div>
    <nav></nav>
    <div class="sidebar-footer">
      <button class="logout-btn" onclick="logout()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Sign out</button>
    </div>
  </aside>
  <div class="main-wrap">
    <header class="topbar">
      <span class="page-title">Notifications</span>
      <div class="topbar-right">
        <button class="bell-btn" onclick="location.href='notifications.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg><span class="bell-badge" id="bell-badge"></span></button>
        <div class="user-chip">
          <div class="user-avatar" id="user-avatar">?</div>
          <div class="user-info">
            <strong id="user-name"></strong>
            <span id="user-role"></span>
          </div>
        </div>
      </div>
    </header>
    <main class="content" style="max-width:840px">
      <div class="masthead">
        <span class="kicker">Announcements</span>
        <h1>Notifications</h1>
        <p class="lede">Course announcements and updates from your lecturers.</p>
        <hr class="rule">
      </div>

      <!-- Lecturer: post new announcement -->
      <div id="post-form" style="display:none" class="card">
        <div class="card-header">Post an announcement</div>
        <div class="card-body">
          <div id="post-msg" class="alert" style="display:none"></div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
            <div class="form-group">
              <label>Course</label>
              <select class="form-control" id="post-course"></select>
            </div>
            <div class="form-group">
              <label>Title</label>
              <input class="form-control" id="post-title" type="text" placeholder="Announcement title">
            </div>
          </div>
          <div class="form-group">
            <label>Message</label>
            <textarea class="form-control" id="post-body" rows="3" placeholder="Write your announcement here…"></textarea>
          </div>
          <button class="btn btn-primary" onclick="postNotif()">Post announcement</button>
        </div>
      </div>

      <!-- Notification list -->
      <div class="section-head"><h3>All notifications</h3></div>
      <div class="card">
        <div id="notif-list"><em style="color:var(--muted);padding:1.4rem;display:block">Loading…</em></div>
      </div>
    </main>
  </div>
</div>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

(async () => {
  const user = await initShell();
  if (!user) return;
  if (user.name) document.getElementById("user-avatar").textContent = user.name.charAt(0).toUpperCase();

  if (user.role === "lecturer") {
    document.getElementById("post-form").style.display = "block";
    const courses = await api.courses.list();
    document.getElementById("post-course").innerHTML = courses.map(c => `<option value="${c.id}">${esc(c.title)}</option>`).join("");
  }

  loadNotifs();
})();

async function loadNotifs() {
  const notifs = await api.notifications.list();
  const el = document.getElementById("notif-list");
  if (notifs.length === 0) { el.innerHTML = "<em style='color:var(--muted);padding:1.4rem;display:block'>No notifications yet</em>"; return; }
  el.innerHTML = notifs.map(n => `
    <div class="notif-item ${n.is_read ? '' : 'unread'}" id="ni-${n.id}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:1rem">
        <div style="flex:1;min-width:0">
          <div class="notif-title">${esc(n.title)}</div>
          <div class="notif-meta">${esc(n.course_title)}${n.sender_name ? ' · ' + esc(n.sender_name) : ''} · ${new Date(n.created_at).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</div>
        </div>
        ${!n.is_read
          ? `<button class="btn btn-sm" style="white-space:nowrap;flex-shrink:0" onclick="markRead('${n.id}')">Mark read</button>`
          : '<span class="badge badge-secondary" style="flex-shrink:0">Read</span>'}
      </div>
      <p style="margin:.6rem 0 0;font-size:.88rem;color:var(--muted);line-height:1.6">${esc(n.body)}</p>
    </div>`).join("");
}

async function markRead(id) {
  await api.notifications.markRead(id);
  const el = document.getElementById("ni-" + id);
  el.classList.remove("unread");
  el.querySelector("button").outerHTML = "<span class='badge badge-secondary' style='flex-shrink:0'>Read</span>";
}

async function postNotif() {
  const course_id = document.getElementById("post-course").value;
  const title = document.getElementById("post-title").value.trim();
  const body = document.getElementById("post-body").value.trim();
  const msg = document.getElementById("post-msg");
  msg.style.display = "none";
  if (!title || !body) { msg.className = "alert alert-danger"; msg.textContent = "Title and message are required"; msg.style.display="block"; return; }
  try {
    await api.notifications.create(course_id, title, body);
    msg.className = "alert alert-success"; msg.textContent = "Announcement posted!"; msg.style.display="block";
    document.getElementById("post-title").value = "";
    document.getElementById("post-body").value = "";
    loadNotifs();
  } catch(e) {
    msg.className = "alert alert-danger"; msg.textContent = e.message; msg.style.display="block";
  }
}
</script>
</body>
</html>
